<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | HotDog Express</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Diseño de la página de acceso. */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #9d0208 0%, #6a040f 100%);
      padding: 20px;
    }

    .login-tarjeta {
      background: var(--blanco);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 380px;
      padding: 36px 30px;
      text-align: center;
    }

    .login-tarjeta img {
      width: 84px;
      height: 84px;
      margin: 0 auto 12px;
      border-radius: 50%;
    }

    .login-tarjeta h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .login-tarjeta h1 span {
      color: var(--rojo);
    }

    .login-tarjeta .eslogan {
      color: var(--gris-texto);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .campo-login {
      text-align: left;
      margin-bottom: 14px;
    }

    .campo-login label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .campo-login input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--borde-suave);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .campo-login input:focus {
      outline: 2px solid var(--amarillo);
      border-color: var(--amarillo);
    }

    .mensaje-error {
      color: var(--rojo);
      font-weight: 600;
      font-size: 0.88rem;
      margin: 10px 0;
      min-height: 20px;
    }

    .btn-login {
      width: 100%;
      margin-top: 8px;
    }

    .nota {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--gris-texto);
      background: #fbeeda;
      border-radius: 8px;
      padding: 8px;
    }
  </style>
</head>
<body>

  <div class="login-tarjeta">
    <img src="img/logo.png" alt="Logo de HotDog Express">
    <h1>HotDog <span>Express</span></h1>
    <p class="eslogan">Administración del negocio</p>

    <form id="formulario-login" onsubmit="return iniciarSesion(event)">
      <div class="campo-login">
        <label for="campo-usuario">Usuario</label>
        <input type="text" id="campo-usuario" placeholder="admin" autocomplete="username" required>
      </div>

      <div class="campo-login">
        <label for="campo-contrasena">Contraseña</label>
        <input type="password" id="campo-contrasena" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <p class="mensaje-error" id="mensaje-error"></p>

      <button type="submit" class="btn btn-primario btn-login">INICIAR SESIÓN</button>
    </form>

    <!-- Nota académica: el login es simulado, no es seguridad real. -->
    <p class="nota">
      Demostración escolar: usa el usuario <strong>admin</strong> y la contraseña
      <strong>admin123</strong>.
    </p>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
